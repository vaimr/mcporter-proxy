name: mcporter-proxy
description: |
  MCP proxy server that provides secure tool execution and file attachment downloads/uploads.
  Tokens are never exposed to agents - they're retrieved from gloves secrets manager.
endpoints:
  - path: /list
    method: GET
    description: List servers - wraps mcporter list with token injection and attachment tool injection
    headers:
      X-MCP-Auth-Key:
        type: string
        description: Auth key for agent (required)
    query:
      type: object
      properties:
        json:
          type: boolean
          description: Return JSON output (parsed from mcporter output)
        schema:
          type: boolean
          description: Include full tool schemas
    response:
      type: object
      properties:
        mode:
          type: string
          description: "list" or "server"
        counts:
          type: object
          description: Server status counts
        servers:
          type: array
          description: List of servers with their tools
    errors:
      401: Missing or invalid auth key
      500: mcporter execution failed

  - path: /list/{mcptype}
    method: GET
    description: Get specific MCP type info
    headers:
      X-MCP-Auth-Key:
        type: string
        description: Auth key for agent (required)
    query:
      type: object
      properties:
        json:
          type: boolean
          description: Return JSON output
        schema:
          type: boolean
          description: Include full tool schemas
    response:
      type: object
      properties:
        mode:
          type: string
          description: "server"
        name:
          type: string
          description: MCP type name
        status:
          type: string
          description: Server status
        tools:
          type: array
          description: List of tools including injected attachment tools
    errors:
      401: Missing or invalid auth key
      404: mcptype not found
      500: mcporter execution failed

  - path: /call
    method: POST
    description: Execute MCP tool with environment variables injected from secrets
    request:
      type: object
      properties:
        tool:
          type: string
          description: Full tool name (e.g., "github.list_repos")
        args:
          type: object
          description: Tool arguments
      required:
        - tool
    response:
      type: object
      properties:
        stdout:
          type: string
          description: Tool stdout output
        stderr:
          type: string
          description: Tool stderr output
        returncode:
          type: integer
          description: Exit code (0 = success)
      example:
        stdout: '{"repos": ["repo1", "repo2"]}'
        stderr: ''
        returncode: 0
    errors:
      400: Bad request - invalid tool or arguments
      403: Tool not in allowed list
      500: Tool execution failed

  - path: /download-attachment
    method: POST
    description: Download file attachment, streaming as multipart response
    request:
      type: object
      properties:
        mcptype:
          type: string
          description: MCP type (e.g., "github", "gitlab", "jira", "confluence")
        args:
          type: object
          description: Platform-specific arguments (owner, repo, asset_id, etc.)
      required:
        - mcptype
        - args
      example:
        mcptype: github
        args:
          owner: octocat
          repo: hello-world
          asset_id: "123456"
          filename: release.zip
    response:
      type: multipart/form-data
      description: File streamed with multipart wrapper
      headers:
        Content-Type: multipart/form-data; boundary=simpleboundary
    errors:
      400: Unknown mcptype or missing arguments
      502: Download failed (upstream error)

  - path: /upload-attachment
    method: POST
    description: Upload file attachment via multipart/form-data
    headers:
      X-MCP-Auth-Key:
        type: string
        description: Auth key for agent (required)
      X-Target-Platform:
        type: string
        description: Platform name (github, gitlab, confluence, jira)
      X-Target-Args:
        type: string
        description: JSON object with platform-specific arguments
      Content-Type:
        type: string
        description: multipart/form-data with boundary
    request:
      type: multipart/form-data
      description: File as form-data part with name="file"
      properties:
        file:
          type: string
          format: binary
          description: File content
    response:
      type: object
      properties:
        success:
          type: boolean
        id:
          type: string
          description: Attachment ID returned by platform
        url:
          type: string
          description: URL to access the uploaded attachment
        filename:
          type: string
          description: Original filename
    errors:
      400: Missing headers, invalid platform, or malformed multipart
      502: Upload failed (upstream error)

authentication:
  header: X-MCP-Auth-Key
  format: '"<agentId>-<agentKey>" or "<agentId>/<agentKey>"'
  description: Auth key is parsed to retrieve secrets from gloves

examples:
  - description: Health check
    request:
      method: GET
      path: /health
    response:
      status: ok

  - description: Execute tool with auth
    request:
      headers:
        Content-Type: application/json
        X-MCP-Auth-Key: myagent-mykey
      body:
        tool: github.list_repos
        args:
          visibility: private
    response:
      stdout: '["my-private-repo"]'
      stderr: ''
      returncode: 0

  - description: Download GitHub release asset
    request:
      headers:
        Content-Type: application/json
        X-MCP-Auth-Key: myagent-mykey
      body:
        mcptype: github
        args:
          owner: octocat
          repo: hello-world
          asset_id: "123456"
          filename: release.zip
    response:
      description: Multipart response containing file binary

  - description: Download Confluence attachment (via MCP tool redirect)
    request:
      headers:
        Content-Type: application/json
        X-MCP-Auth-Key: myagent-mykey
      body:
        mcptype: confluence
        args:
          page_id: "123456"
          filename: document.pdf
    response:
      description: Multipart response containing file binary

  - description: Upload file to Confluence
    request:
      headers:
        Content-Type: multipart/form-data; boundary=simpleboundary
        X-MCP-Auth-Key: myagent-mykey
        X-Target-Platform: confluence
        X-Target-Args: '{"page_id":"123456","name":"report.pdf"}'
      body:
        description: Multipart form with file part
    response:
      success: true
      id: "att123456"
      url: "https://conf.example.com/wiki/download/attachments/123456/report.pdf"
      filename: report.pdf

  - description: Upload file to Jira
    request:
      headers:
        Content-Type: multipart/form-data; boundary=simpleboundary
        X-MCP-Auth-Key: myagent-mykey
        X-Target-Platform: jira
        X-Target-Args: '{"issue_key":"PROJ-123","name":"attachment.zip"}'
      body:
        description: Multipart form with file part
    response:
      success: true
      id: "abc123"
      url: "https://jira.example.com/secure/attachment/abc123/attachment.zip"
      filename: attachment.zip

cli_usage:
  tool_call: mcporter-proxy call <tool> [args]
  download: mcporter-proxy download <platform> [args] [--output <path>]
  upload: mcporter-proxy upload <platform> [args] [--file <path>] [--content-type <type>]
  list: mcporter-proxy list [name] [--json] [--schema]
  examples:
    - mcporter-proxy call github.list_repos visibility=private
    - mcporter-proxy download github owner=octocat repo=hello-world asset_id=123 --output release.zip
    - mcporter-proxy upload confluence page_id=123456 name=report.pdf --file ./report.pdf
    - mcporter-proxy upload jira issue_key=PROJ-123 name=attachment.zip --file ./attachment.zip
    - mcporter-proxy list
    - mcporter-proxy list github
    - mcporter-proxy list --json
    - mcporter-proxy list github --json --schema
